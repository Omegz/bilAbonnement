# ===== Application Properties =====
# Konfigurationsfil for Spring Boot applikationen.
# Bruges til at konfigurere serverport, databaseforbindelse og driver.
#
# Foelsomme data (passwords, brugernavne, URL'er) laeses fra MILJOEVARIABLER
# via ${ENV_VAR} syntaksen, saa de IKKE staar hardcodet i denne fil.
# Miljoevariablerne saettes i .env filen (som er i .gitignore og aldrig committes).
#
# ${PORT:9091} betyder: brug miljoevariablen PORT hvis den er sat, ellers brug 9091.
# ${SPRING_DATASOURCE_URL} UDEN fallback betyder: miljoevariablen SKAL vaere sat.

spring.application.name=bilAbonnement

# Serverport: Render saetter PORT automatisk. Lokalt falder den tilbage til 9091.
# PORT er den eneste med fallback-vaerdi, fordi porten ikke er foelsom data.
server.port=${PORT:9091}

# Databaseforbindelse: hentes fra miljoevariabler (sat i .env filen).
# Ingen fallback-vaerdier her — passwords og brugernavne maa ALDRIG staa i koden.
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}

# Fortaeller Spring at der bruges MySQL-driveren (TiDB bruger MySQL-protokollen).
# Dette er ikke foelsomt, saa det staar direkte her.
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
