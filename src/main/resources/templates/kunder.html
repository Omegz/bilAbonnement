<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>Kunder</title>
  <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<div th:replace="fragments/navbar :: navbar"></div>

<!-- Semantic HTML: <main> markerer hovedindholdet paa siden.
     <main> er et block-element (tager fuld bredde, starter paa ny linje). -->
<main class="container">

  <!-- <header> markerer toppen af en sektion (ikke hele sidens header).
       <header> er et block-element. -->
  <header>
    <h1>Kunder</h1>
    <p class="subtext">Opret nye kunder og se listen over kunder i databasen.</p>
  </header>

  <!-- <section> grupperer relateret indhold.
       Her: formular-sektionen og tabel-sektionen er to separate sektioner. -->
  <section>
    <h2>Opret kunde</h2>
    <form th:action="@{/kunder}" th:object="${kunde}" method="post">
      <div class="field">
        <label for="navn">Navn:</label>
        <input id="navn" type="text" th:field="*{navn}" required>
      </div>
      <div class="field">
        <label for="email">Email:</label>
        <input id="email" type="email" th:field="*{email}">
      </div>
      <div class="field">
        <label for="telefon">Telefon:</label>
        <input id="telefon" type="text" th:field="*{telefon}">
      </div>
      <div>
        <button type="submit">Gem kunde</button>
      </div>
    </form>
  </section>

  <section>
    <h2>Alle kunder</h2>
    <table>
      <thead>
      <tr>
        <th>ID</th>
        <th>Navn</th>
        <th>Email</th>
        <th>Telefon</th>
        <th>Handling</th>
      </tr>
      </thead>
      <tbody>
      <tr th:each="k : ${kunder}">
        <td th:text="${k.id}"></td>
        <td th:text="${k.navn}"></td>
        <td th:text="${k.email}"></td>
        <td th:text="${k.telefon}"></td>
        <td>
          <!-- <a> er et inline-element (fylder kun sin teksts bredde, starter ikke ny linje).
               Slet-link bruger @PathVariable: /kunder/slet/{id} -->
          <a th:href="@{/kunder/slet/{id}(id=${k.id})}">Slet</a>
        </td>
      </tr>
      </tbody>
    </table>
  </section>

  <!-- <footer> markerer bunden af en sektion.
       <footer> er et block-element. -->
  <footer>
    <p class="hint">Kunder bruges i abonnementer og lejeaftaler.</p>
  </footer>

</main>

</body>
</html>
