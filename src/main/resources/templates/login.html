<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Login</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">

</head>
<body class="page-body-gradient">
<div th:replace="fragments/navbar :: navbar"></div>

<div class="auth-wrapper">
    <div class="auth-card">
        <h1>Login (intern)</h1>
        <p class="subtext">Log ind med dit medarbejder-login.</p>

        <div th:if="${fejl}" class="fejl" th:text="${fejl}"></div>

        <form th:action="@{/login}" method="post">
            <div class="field">
                <label for="navn">Navn</label>
                <input id="navn" name="navn" type="text" required>
            </div>

            <div class="field">
                <label for="password">Password</label>
                <input id="password" name="password" type="password" required>
            </div>

            <div>
                <button type="submit">Log ind</button>
            </div>
        </form>

        <p>
            Har du ikke en bruger endnu? <a th:href="@{/signup}">Opret bruger</a>
        </p>
    </div>
</div>

</body>
</html>
