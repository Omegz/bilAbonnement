# Test-konfiguration: bruges naar Maven koerer tests.
# Disse vaerdier overskriver src/main/resources/application.properties under test.
# Vi bruger H2 (in-memory database) til tests saa vi ikke rammer den rigtige database.
spring.datasource.url=jdbc:h2:mem:testdb
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver
